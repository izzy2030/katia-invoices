<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120" fill="none" role="img" aria-label="Katia Auto Sales &amp; Repairs Hex Badge">
  <defs>
    <linearGradient id="kh-outer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kh-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="kh-core-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#090f1d"/>
    </linearGradient>
    <linearGradient id="kh-k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Outer Hexagonal Lug-Nut Frame -->
  <polygon
    points="60,4 109,32 109,88 60,116 11,88 11,32"
    fill="url(#kh-outer-grad)"
    stroke="url(#kh-rim-grad)"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Recessed Inner Hex Bezel -->
  <polygon
    points="60,12 101,36 101,84 60,108 19,84 19,36"
    fill="url(#kh-core-grad)"
    stroke="#38bdf8"
    stroke-opacity="0.48"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- 6 Machined Corner Hex Bolts / Rivets -->
  <circle cx="60" cy="8.2" r="1.9" fill="#94a3b8" />
  <circle cx="104.8" cy="34.1" r="1.9" fill="#94a3b8" />
  <circle cx="104.8" cy="85.9" r="1.9" fill="#94a3b8" />
  <circle cx="60" cy="111.8" r="1.9" fill="#94a3b8" />
  <circle cx="15.2" cy="85.9" r="1.9" fill="#94a3b8" />
  <circle cx="15.2" cy="34.1" r="1.9" fill="#94a3b8" />

  <!-- Subtle Upper Car Roofline & Hood Silhouette -->
  <path
    d="M36 30 L45 22 H75 L84 30"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.6"
  />
  <rect x="53" y="16.5" width="14" height="2.4" rx="1.2" fill="#38bdf8" opacity="0.88" />

  <!-- Twin Aerodynamic Speed Stripes (Left & Right Flanks) -->
  <path d="M21 56 H32 L34 60 H21 Z" fill="#2563eb" />
  <path d="M21 63 H33 L31 66.5 H21 Z" fill="#38bdf8" opacity="0.88" />
  <path d="M88 56 H99 V60 H86 Z" fill="#2563eb" />
  <path d="M87 63 H99 V66.5 H89 Z" fill="#38bdf8" opacity="0.88" />

  <!-- Stylized Car Front Grille & Angled Headlight Wings -->
  <path
    d="M25 76 L33 70 H87 L95 76 L91 82 H29 L25 76 Z"
    fill="#2563eb"
    fill-opacity="0.28"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <polygon points="27,75 35,71.5 39,75 30,78.5" fill="#38bdf8" />
  <polygon points="93,75 85,71.5 81,75 90,78.5" fill="#38bdf8" />
  <line x1="43" y1="74" x2="77" y2="74" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.68" />
  <line x1="45" y1="77.5" x2="75" y2="77.5" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.68" />

  <!-- Heavy-Duty Geometric Letter 'K' Merged with Grille Crossbar -->
  <path d="M36 31 H49.5 V81 H36 V31 Z" fill="url(#kh-k-grad)" />
  <path d="M48.5 52.5 H55 L74 31 H87.5 L64.5 56 L88 81 H73.5 L54.5 59 H48.5 V52.5 Z" fill="url(#kh-k-grad)" />
  <path d="M52 46.5 L66 31 H71.5 L52 52.5 V46.5 Z" fill="#38bdf8" />

  <!-- Bottom Hex Facet Location Stamp ('AURORA · IL') -->
  <path d="M35 88 H85 L78 96 H42 Z" fill="#2563eb" fill-opacity="0.38" />
  <text
    x="60"
    y="94.3"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="Manrope, 'Segoe UI', Arial, sans-serif"
    font-size="6.5"
    font-weight="800"
    letter-spacing="1.8"
  >AURORA · IL</text>
</svg>
